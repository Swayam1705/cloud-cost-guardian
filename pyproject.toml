[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-cost-guardian"
version = "1.0.0"
description = "Zero-cost, local-first AWS waste detection with safe, approval-gated remediation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Cloud Cost Guardian Contributors" }]
keywords = ["aws", "finops", "cloud-cost", "devops", "boto3"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "boto3>=1.34,<2",
  "pydantic>=2.5,<3",
  "pydantic-settings>=2.1,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "moto[ec2,rds]>=5,<6",
  "ruff>=0.5",
  "mypy>=1.10",
  "pip-audit>=2.7",
  "boto3-stubs[ec2,rds,cloudwatch,sns]>=1.34",
]

[project.scripts]
ccg = "cloud_cost_guardian.cli.main:main"

[project.urls]
Homepage = "https://github.com/<your-username>/cloud-cost-guardian"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cloud_cost_guardian = ["pricing/data/*.json", "demo/data/*.json"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["artifacts", "data", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "C4", "SIM", "RUF"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
packages = ["cloud_cost_guardian"]
plugins = ["pydantic.mypy"]
warn_unreachable = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*", "moto", "moto.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["integration: tests that use moto-based AWS simulation"]
filterwarnings = ["error::DeprecationWarning:cloud_cost_guardian.*"]

[tool.coverage.run]
source = ["cloud_cost_guardian"]
branch = true
