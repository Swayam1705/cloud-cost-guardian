name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Format · Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check . --output-format=github
      - name: Ruff format check
        run: ruff format --check .
      - name: mypy (strict)
        run: mypy

  tests:
    name: Tests (py${{ matrix.python }} · ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - name: Unit tests
        run: pytest -q -m "not integration" --cov --cov-report=xml
      - name: Integration tests (moto)
        run: pytest -q -m integration
      - name: Smoke test (PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke_test.ps1
      - name: Smoke test (bash)
        if: runner.os != 'Windows'
        run: bash scripts/smoke_test.sh
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7

  terraform:
    name: Terraform fmt · validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.*"
      - run: terraform fmt -check -recursive -diff
      - name: Create placeholder Lambda package (validate only, never applied)
        run: touch ../lambda_package.zip
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  docker:
    name: Docker build · demo smoke
    runs-on: ubuntu-latest
    needs: [quality, tests]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: cloud-cost-guardian:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run demo scan in container
        run: docker run --rm cloud-cost-guardian:ci scan --mode demo --no-notify
      - name: Dry-run cleanup in container (state persisted via volume)
        run: |
          mkdir -p "$PWD/ci-artifacts" "$PWD/ci-data"
          chmod 777 "$PWD/ci-artifacts" "$PWD/ci-data"
          docker run --rm -v "$PWD/ci-artifacts:/app/artifacts" -v "$PWD/ci-data:/app/data" cloud-cost-guardian:ci scan --mode demo
          docker run --rm -v "$PWD/ci-artifacts:/app/artifacts" -v "$PWD/ci-data:/app/data" cloud-cost-guardian:ci cleanup --dry-run
          test -f ci-artifacts/reports/latest.json
      - name: Container runs as non-root
        run: |
          uid=$(docker run --rm --entrypoint id cloud-cost-guardian:ci -u)
          test "$uid" != "0"
